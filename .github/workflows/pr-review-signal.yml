name: PR Review Signal

on:
  pull_request_review:
    types: [submitted, dismissed]

# This event can use candidate workflow code. It conveys no authority: the
# default-branch workflow_run consumer fetches all review metadata afresh.
permissions: {}

jobs:
  notify:
    runs-on: ${{ fromJSON((!startsWith(github.event_name, 'pull_request') || (github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))) && '["factory-keystone-polyphony"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 1
    steps:
      - run: 'true'
